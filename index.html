    <style>
      /*
       * The loader, drawn before the app loads: black space, a field of stars,
       * a planet's night side along the foot of the screen with only its
       * atmosphere lit, and the name. Any key or tap launches (and, being a
       * gesture, lets the sound play): the planet falls away, the stars stretch
       * and hyperspace fills the screen for the whole jump, so nothing that
       * loads later cuts into it. The app spools it up into a white flash and
       * removes the loader under it; the deck and the system are there as it
       * clears. Only transform, opacity and filter animate.
       */
      @font-face {
        /* the title's letters only, so it is here with the page */
        font-family: 'Archivo Title';
        src: url('./fonts/archivo-title.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        overflow: hidden;
        background: #02040a;
        color: #eef3fb;
        font-family: 'Archivo Title', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 400ms cubic-bezier(0.23, 1, 0.32, 1);
        -webkit-user-select: none;
        user-select: none;
      }
      #boot .space,
      #boot .sky,
      #boot .hyper,
      #boot .flash {
        position: absolute;
        inset: 0;
      }
      #boot .sky {
        width: 100%;
        height: 100%;
        transition: opacity 700ms cubic-bezier(0.55, 0, 0.75, 0.2), transform 900ms cubic-bezier(0.55, 0, 0.75, 0.2);
      }
      /* the night side of a planet along the foot of the screen, lit only at the rim */
      #boot .limb {
        position: absolute;
        left: 50%;
        top: calc(100% - 17vmin);
        width: 240vmax;
        height: 240vmax;
        margin-left: -120vmax;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 0%, #0a1222 0%, #03060d 6%, #02040a 30%);
        box-shadow:
          inset 0 1px 0 0 rgba(214, 232, 255, 0.85),
          inset 0 10px 22px -12px rgba(120, 175, 255, 0.75),
          0 -1px 10px 0 rgba(130, 185, 255, 0.55),
          0 -12px 70px 0 rgba(60, 120, 255, 0.28);
        transition: transform 1000ms cubic-bezier(0.55, 0, 0.75, 0.2), opacity 800ms cubic-bezier(0.55, 0, 0.75, 0.2);
        animation: boot-rise 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards;
      }
      /* the sun just below the limb at the top of the arc: a hot point on the rim, a thin band along it, a wide glow */
      #boot .limb::after {
        content: '';
        position: absolute;
        left: 50%;
        top: -30vmin;
        width: 120vmin;
        height: 60vmin;
        margin-left: -60vmin;
        background:
          radial-gradient(ellipse 4% 2.4% at 50% 50%, rgba(255, 250, 240, 1), rgba(255, 250, 240, 0) 100%),
          radial-gradient(ellipse 30% 2.2% at 50% 50%, rgba(255, 226, 190, 0.7), rgba(255, 226, 190, 0) 100%),
          radial-gradient(ellipse 50% 30% at 50% 50%, rgba(120, 170, 255, 0.2), rgba(120, 170, 255, 0) 100%);
        pointer-events: none;
      }
      @keyframes boot-rise {
        from { transform: translateY(6vmin); opacity: 0; }
      }
      #boot .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 40%;
        margin: 0;
        padding: 0 24px;
        transform: translateY(-50%);
        text-align: center;
        transition: opacity 260ms ease-out, filter 260ms ease-out;
      }
      #boot .name {
        display: block;
        font-size: clamp(42px, 8.4vw, 112px);
        font-weight: 540;
        font-stretch: 118%;
        letter-spacing: -0.03em;
        line-height: 0.95;
        animation: boot-in 1100ms cubic-bezier(0.23, 1, 0.32, 1) 150ms backwards;
      }
      #boot .prompt {
        display: block;
        margin-top: clamp(22px, 3.2vw, 36px);
        font-size: 12px;
        font-weight: 500;
        font-stretch: 100%;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(225, 236, 255, 0.78);
        animation:
          boot-in 900ms cubic-bezier(0.23, 1, 0.32, 1) 700ms backwards,
          boot-call 2.4s ease-in-out 1600ms infinite;
      }
      #boot .prompt .coarse { display: none; }
      @media (pointer: coarse) {
        #boot .prompt .fine { display: none; }
        #boot .prompt .coarse { display: inline; }
      }
      @keyframes boot-in {
        from { opacity: 0; filter: blur(10px); transform: translateY(8px); }
      }
      @keyframes boot-call {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      /* a link to a planet or the reader, or reduced motion: no launch, just the name while loading */
      #boot.boot-direct .prompt {
        visibility: hidden;
      }

      /*
       * Hyperspace: one field of streaks drawn once, in three copies zooming out
       * past the viewer a third of a cycle apart, over a deep blue tunnel glow.
       */
      #boot .hyper {
        opacity: 0;
        background: radial-gradient(circle at 50% 50%, #eef4ff 0%, #9db8ff 3%, #3b5cc4 12%, #142463 34%, #060b22 62%, #02040a 100%);
        transition: opacity 500ms cubic-bezier(0.23, 1, 0.32, 1) 120ms;
      }
      #boot .hyper i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 120vmax;
        height: 120vmax;
        margin: -60vmax 0 0 -60vmax;
        background-size: 100% 100%;
        opacity: 0;
        will-change: transform, opacity;
        animation: boot-warp 1.1s linear infinite;
      }
      #boot .hyper i:nth-child(2) { animation-delay: -0.367s; --r: 40deg; }
      #boot .hyper i:nth-child(3) { animation-delay: -0.733s; --r: 80deg; }
      #boot:not(.boot-go) .hyper i { animation-play-state: paused; }
      @keyframes boot-warp {
        0% { transform: scale(0.35) rotate(var(--r, 0deg)); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: scale(1.4) rotate(var(--r, 0deg)); opacity: 0; }
      }

      /* launch: the name goes, the planet falls away, the stars rush past, hyperspace comes up */
      #boot.boot-go .title {
        opacity: 0;
        filter: blur(8px);
      }
      #boot.boot-go .limb {
        transform: translateY(40vh);
        opacity: 0;
      }
      #boot.boot-go .sky {
        transform: scale(2.2);
        opacity: 0;
      }
      #boot.boot-go .hyper {
        opacity: 1;
      }

      /* the drive spools: hyperspace surges toward the eye, everything shakes, the light goes white */
      #boot .flash {
        background: #e4efff;
        opacity: 0;
      }
      #boot.boot-spool .hyper {
        transform: scale(1.5);
        transition: opacity 500ms cubic-bezier(0.23, 1, 0.32, 1), transform 560ms cubic-bezier(0.55, 0, 1, 0.45);
      }
      #boot.boot-spool .space {
        animation: boot-shake 70ms linear infinite;
      }
      #boot.boot-spool .flash {
        opacity: 1;
        transition: opacity 560ms cubic-bezier(0.7, 0, 0.84, 0);
      }
      @keyframes boot-shake {
        0% { transform: translate(0, 0); }
        25% { transform: translate(2px, -1px); }
        50% { transform: translate(-1px, 2px); }
        75% { transform: translate(-2px, -1px); }
      }
      /* dropped out: under the full flash the loader's picture goes and the flash clears off the system */
      #boot.boot-out {
        background: transparent;
      }
      #boot.boot-out .space,
      #boot.boot-out .title {
        visibility: hidden;
      }
      #boot.boot-out .flash {
        opacity: 0;
        transition: opacity 520ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot.boot-done {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .hyper i { animation: none; opacity: 0.8; transform: scale(0.9); }
        #boot .hyper i:nth-child(n + 2) { display: none; }
        #boot .name, #boot .prompt, #boot .limb { animation: none; }
        #boot.boot-spool .space { animation: none; }
      }
    </style>
  </head>

    <div id="boot" role="status">
      <div class="space" aria-hidden="true">
        <canvas class="sky"></canvas>
        <div class="limb"></div>
        <div class="hyper"><i></i><i></i><i></i></div>
      </div>
      <h1 class="title">
        <span class="name">John Mannully</span>
        <span class="prompt"><span class="fine">Press any key to launch</span><span class="coarse">Tap to launch</span></span>
      </h1>
      <div class="flash" aria-hidden="true"></div>

    <script>
      // The loader: the name over a planet's night side, then hyperspace once a key or tap launches.
      // It runs before the app bundle; the app waits for the launch and takes it from there through window.__nav.
      (function () {
        var boot = document.getElementById('boot');

        // draw the streak field once; CSS zooms the copies
        try {
          var N = 512;
          var cv = document.createElement('canvas');
          cv.width = cv.height = N;
          var g = cv.getContext('2d');
          var c = N / 2;
          g.lineCap = 'round';
          for (var i = 0; i < 260; i += 1) {
            var a = Math.random() * 6.2832;
            var r0 = c * (0.05 + Math.pow(Math.random(), 0.8) * 0.85);
            var len = c * (0.05 + 0.26 * (r0 / c));
            var k = 0.35 + 0.65 * (r0 / c);
            g.strokeStyle = 'rgba(235, 244, 255, ' + (0.9 * k).toFixed(3) + ')';
            g.lineWidth = 0.6 + 1.5 * k;
            g.beginPath();
            g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
            g.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len));
            g.stroke();
          }
          var url = 'url(' + cv.toDataURL('image/png') + ')';
          var layers = boot.querySelectorAll('.hyper i');
          for (var j = 0; j < layers.length; j += 1) layers[j].style.backgroundImage = url;
        } catch (e) {
          /* no canvas: the glow alone */
        }

        // the stars: mostly faint pinpricks, a few brighter and slightly warm or cool
        var sky = boot.querySelector('.sky');
        var drawSky = function () {
          try {
            var dpr = Math.min(2, window.devicePixelRatio || 1);
            var W = window.innerWidth, H = window.innerHeight;
            sky.width = Math.round(W * dpr);
            sky.height = Math.round(H * dpr);
            var s = sky.getContext('2d');
            s.setTransform(dpr, 0, 0, dpr, 0, 0);
            var n = Math.round((W * H) / 2600);
            for (var q = 0; q < n; q += 1) {
              var b = Math.pow(Math.random(), 3);
              var tint = Math.random() < 0.5 ? '205, 220, 255' : '255, 236, 214';
              s.fillStyle = 'rgba(' + tint + ', ' + (0.12 + b * 0.85).toFixed(2) + ')';
              s.beginPath();
              s.arc(Math.random() * W, Math.random() * H, 0.35 + b * 0.9, 0, 6.2832);
              s.fill();
            }
          } catch (e) {
            /* no canvas: plain black */
          }
        };
        drawSky();
        var resized = 0;
        window.addEventListener('resize', function () {
          clearTimeout(resized);
          resized = setTimeout(function () { if (boot.isConnected) drawSky(); }, 150);
        });

        // a link to a planet or the reader, or reduced motion: no launch, the loader just fades
        var direct = !!location.hash.replace(/^#\/?/, '') ||
          (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (direct) boot.classList.add('boot-direct');

        // any key or tap launches; the same gesture lets the warp be heard
        var departed = false;
        var queue = [];
        var depart = function (e) {
          if (departed || direct) return;
          if (e.type === 'keydown') {
            if (e.metaKey || e.ctrlKey || e.altKey || /^(Tab|Shift|Control|Alt|Meta|CapsLock)$/.test(e.key)) return;
            if (e.key === ' ') e.preventDefault();
          }
          departed = true;
          window.__nav.departedAt = performance.now();
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              var ac = new AC();
              ac.resume();
              window.__bootAudio = ac;
            }
          } catch (err) {
            /* no audio: the warp is silent */
          }
          boot.classList.add('boot-go');
          window.removeEventListener('keydown', depart, true);
          window.removeEventListener('pointerdown', depart, true);
          for (var w = 0; w < queue.length; w += 1) queue[w]();
          queue = [];
        };
        window.addEventListener('keydown', depart, true);
        window.addEventListener('pointerdown', depart, true);

        window.__nav = {
          departedAt: 0,
          onDepart: function (fn) { if (departed) fn(); else queue.push(fn); }
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

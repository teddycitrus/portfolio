    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background-color: #05070d;
        transition: background-color 450ms cubic-bezier(0.4, 0, 0.2, 1), opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* the scene is up: the cabin and the hyperspace outside it show through, the nav display stays */
      #boot.boot-handoff {
        background-color: transparent;
      }
      #boot.boot-handoff canvas {
        opacity: 0;
      }
      #boot.boot-done {
        opacity: 0;
      }
      #boot .nav {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 7vh, 64px));
        width: min(340px, calc(100vw - 32px));
        box-sizing: border-box;
        transform: translateX(-50%);
        padding: 12px 14px 13px;
        border: 1px solid rgba(169, 220, 255, 0.28);
        border-radius: 6px;
        background:
          repeating-linear-gradient(0deg, rgba(169, 220, 255, 0.035) 0 1px, transparent 1px 3px),
          rgba(6, 12, 22, 0.8);
        box-shadow: 0 0 24px rgba(90, 170, 255, 0.12), inset 0 0 18px rgba(90, 170, 255, 0.08);
        font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #a9dcff;
        text-shadow: 0 0 10px rgba(110, 200, 255, 0.5);
        transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1), transform 600ms cubic-bezier(0.4, 0, 0.2, 1),
          border-color 300ms ease-out;
      }
      #boot.boot-nav-off .nav {
        opacity: 0;
        transform: translateX(-50%) translateY(8px);
      }
      #boot .nav-head,
      #boot .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin: 0;
      }
      #boot .nav-head {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      #boot .nav-row {
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      #boot .nav-status {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #boot .nav-pct {

      }
      #boot .nav-bar {
        position: relative;
        height: 4px;
        margin-top: 10px;
        border-radius: 2px;
        background: rgba(169, 220, 255, 0.14);
        overflow: hidden;
      }
      #boot .nav-fill {
        position: absolute;
        inset: 0;
        transform-origin: 0 50%;
        transform: scaleX(0);
        background: linear-gradient(90deg, #4f9dff, #bfe6ff);
        box-shadow: 0 0 10px rgba(130, 200, 255, 0.8);
      }
      #boot.boot-arrived .nav {
        border-color: rgba(191, 230, 255, 0.6);
      }
      #boot.boot-arrived .nav-status {

    <div id="boot" role="status" aria-label="Loading">
      <canvas aria-hidden="true"></canvas>
      <div class="nav">
        <p class="nav-head"><span>Mannully Space Co.</span><span>Nav</span></p>
        <p class="nav-row"><span class="nav-status">In hyperspace</span><span class="nav-pct">0%</span></p>
        <div class="nav-bar" aria-hidden="true"><div class="nav-fill"></div></div>
      </div>

    <script>
      // The loader: hyperspace streaking past and the nav display counting toward the destination.
      // It runs before the app bundle; once that is up the app drives the display through window.__nav.
      (function () {
        var boot = document.getElementById('boot');
        var cv = boot.querySelector('canvas');
        var g = cv.getContext('2d');
        var fill = boot.querySelector('.nav-fill');
        var pct = boot.querySelector('.nav-pct');
        var status = boot.querySelector('.nav-status');
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var t0 = performance.now();
        var last = t0;
        var shown = 0;
        var floor = 0;
        var run = null;
        var drawing = true;
        var stars = [];
        for (var i = 0; i < 260; i += 1) stars.push({ a: Math.random() * 6.2832, r: 0.12 + Math.random() * 1.1, z: Math.random() });
        var w = 0;
        var h = 0;
        var fit = function () {
          var d = Math.min(window.devicePixelRatio || 1, 2);
          w = cv.width = Math.round(innerWidth * d);
          h = cv.height = Math.round(innerHeight * d);
          if (still) draw(0);
        };
        var draw = function (dt) {
          var cx = w / 2;
          var cy = h / 2;
          var f = Math.max(w, h) * 0.11;
          g.fillStyle = '#05070d';
          g.fillRect(0, 0, w, h);
          var glow = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.6);
          glow.addColorStop(0, 'rgba(150, 190, 255, 0.28)');
          glow.addColorStop(0.25, 'rgba(70, 110, 230, 0.1)');
          glow.addColorStop(1, 'rgba(5, 7, 13, 0)');
          g.fillStyle = glow;
          g.fillRect(0, 0, w, h);
          g.lineCap = 'round';
          for (var i = 0; i < stars.length; i += 1) {
            var s = stars[i];
            if (!still) s.z -= dt * 0.5;
            if (s.z <= 0.03) {
              s.z += 1;
              s.a = Math.random() * 6.2832;
            }
            var r0 = (s.r / s.z) * f;
            var r1 = (s.r / Math.min(1.2, s.z + (still ? 0.004 : 0.18))) * f;
            var ca = Math.cos(s.a);
            var sa = Math.sin(s.a);
            var k = Math.min(1, (1 - s.z) * 1.5);
            g.strokeStyle = 'rgba(205, 228, 255, ' + (0.9 * k).toFixed(3) + ')';
            g.lineWidth = Math.max(1, 2.6 * k * Math.min(2, w / 1200));
            g.beginPath();
            g.moveTo(cx + ca * r1, cy + sa * r1);
            g.lineTo(cx + ca * r0, cy + sa * r0);
            g.stroke();
          }
        };
        var frame = function (now) {
          if (!boot.isConnected) return;
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (run) {
            var u = Math.min(1, (now - run.at) / run.ms);
            shown = run.from + (run.to - run.from) * u * (2 - u);
          } else {
            // until the app is driving, creep most of the way and wait there
            var target = Math.max(floor, 0.72 * (1 - Math.exp(-(now - t0) / 2200)));
            shown += (target - shown) * Math.min(1, dt * 6);
          }
          fill.style.transform = 'scaleX(' + shown.toFixed(4) + ')';
          pct.textContent = Math.round(shown * 100) + '%';
          if (drawing && !still) draw(dt);
          requestAnimationFrame(frame);
        };
        fit();
        addEventListener('resize', fit);
        requestAnimationFrame(frame);
        window.__nav = {
          floor: function (p) { floor = Math.max(floor, p); },
          to: function (p, ms) { run = { from: shown, to: p, at: performance.now(), ms: Math.max(1, ms) }; },
          status: function (text) { status.textContent = text; },
          stopDrawing: function () { drawing = false; }
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background-color: #05070d;
        transition: background-color 450ms cubic-bezier(0.4, 0, 0.2, 1), opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      /*
       * Hyperspace: one field of streaks drawn once, in three copies zooming out
       * past the viewer a third of a cycle apart. Transform and opacity only, so
       * it runs on the compositor and never holds up the app loading under it.
       */
      #boot .warp {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, rgba(150, 190, 255, 0.22) 0%, rgba(70, 110, 230, 0.08) 18%, rgba(5, 7, 13, 0) 60%);
        transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot .warp i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 110vmax;
        height: 110vmax;
        margin: -55vmax 0 0 -55vmax;
        background-size: 100% 100%;
        opacity: 0;
        will-change: transform, opacity;
        animation: boot-warp 1.8s linear infinite;
      }
      #boot .warp i:nth-child(2) { animation-delay: -0.6s; }
      #boot .warp i:nth-child(3) { animation-delay: -1.2s; }
      @keyframes boot-warp {
        0% { transform: scale(0.35) rotate(var(--r, 0deg)); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: scale(1.4) rotate(var(--r, 0deg)); opacity: 0; }
      }
      #boot .warp i:nth-child(2) { --r: 40deg; }
      #boot .warp i:nth-child(3) { --r: 80deg; }
      @media (prefers-reduced-motion: reduce) {
        #boot .warp i { animation: none; opacity: 0.8; transform: scale(0.9); }
        #boot .warp i:nth-child(n + 2) { display: none; }
      }
      /* the scene is up: the cabin and the hyperspace outside it show through, the nav display stays */
      #boot.boot-handoff {
        background-color: transparent;
      }
      #boot.boot-handoff .warp {
        opacity: 0;
      }
      #boot.boot-done {
        opacity: 0;
      }
      #boot .nav {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 7vh, 64px));
        width: min(340px, calc(100vw - 32px));
        box-sizing: border-box;
        transform: translateX(-50%);
        padding: 12px 14px 13px;
        border: 1px solid rgba(169, 220, 255, 0.28);
        border-radius: 6px;
        background:
          repeating-linear-gradient(0deg, rgba(169, 220, 255, 0.035) 0 1px, transparent 1px 3px),
          rgba(6, 12, 22, 0.8);
        box-shadow: 0 0 24px rgba(90, 170, 255, 0.12), inset 0 0 18px rgba(90, 170, 255, 0.08);
        font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #a9dcff;
        text-shadow: 0 0 10px rgba(110, 200, 255, 0.5);
        transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1), transform 600ms cubic-bezier(0.4, 0, 0.2, 1),
          border-color 300ms ease-out;
      }
      #boot.boot-nav-off .nav {
        opacity: 0;
        transform: translateX(-50%) translateY(8px);
      }
      #boot .nav-head,
      #boot .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin: 0;
      }
      #boot .nav-head {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      #boot .nav-row {
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      #boot .nav-status {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #boot .nav-pct {
        font-variant-numeric: tabular-nums;
        color: #e8f6ff;
      }
      #boot .nav-bar {
        position: relative;
        height: 4px;
        margin-top: 10px;
        border-radius: 2px;
        background: rgba(169, 220, 255, 0.14);
        overflow: hidden;
      }
      #boot .nav-fill {
        position: absolute;
        inset: 0;
        transform-origin: 0 50%;
        transform: scaleX(0);
        background: linear-gradient(90deg, #4f9dff, #bfe6ff);
        box-shadow: 0 0 10px rgba(130, 200, 255, 0.8);
      }
      #boot.boot-arrived .nav {
        border-color: rgba(191, 230, 255, 0.6);
      }
      #boot.boot-arrived .nav-status {
        color: #ffffff;
      }

    <div id="boot" role="status" aria-label="Loading">
      <div class="warp" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="nav">
        <p class="nav-head"><span>Mannully Space Co.</span><span>Nav</span></p>
        <p class="nav-row"><span class="nav-status">In hyperspace</span><span class="nav-pct">0%</span></p>
        <div class="nav-bar" aria-hidden="true"><div class="nav-fill"></div></div>
      </div>

    <script>
      // The loader: hyperspace streaking past and the nav display counting toward the destination.
      // It runs before the app bundle; once that is up the app drives the display through window.__nav.
      (function () {
        var boot = document.getElementById('boot');
        var fill = boot.querySelector('.nav-fill');
        var pct = boot.querySelector('.nav-pct');
        var status = boot.querySelector('.nav-status');

        // draw the streak field once; CSS zooms the copies
        try {
          var N = 512;
          var cv = document.createElement('canvas');
          cv.width = cv.height = N;
          var g = cv.getContext('2d');
          var c = N / 2;
          g.lineCap = 'round';
          for (var i = 0; i < 200; i += 1) {
            var a = Math.random() * 6.2832;
            var r0 = c * (0.06 + Math.pow(Math.random(), 0.8) * 0.85);
            var len = c * (0.04 + 0.22 * (r0 / c));
            var k = 0.35 + 0.65 * (r0 / c);
            g.strokeStyle = 'rgba(205, 228, 255, ' + (0.85 * k).toFixed(3) + ')';
            g.lineWidth = 0.6 + 1.6 * k;
            g.beginPath();
            g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
            g.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len));
            g.stroke();
          }
          var url = 'url(' + cv.toDataURL('image/png') + ')';
          var layers = boot.querySelectorAll('.warp i');
          for (var j = 0; j < layers.length; j += 1) layers[j].style.backgroundImage = url;
        } catch (e) {
          /* no canvas: the glow alone */
        }

        var t0 = performance.now();
        var last = t0;
        var shown = 0;
        var floor = 0;
        var run = null;
        var frame = function (now) {
          if (!boot.isConnected) return;
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (run) {
            var u = Math.min(1, (now - run.at) / run.ms);
            shown = run.from + (run.to - run.from) * u * (2 - u);
          } else {
            // until the app is driving, creep most of the way and wait there
            var target = Math.max(floor, 0.72 * (1 - Math.exp(-(now - t0) / 2200)));
            shown += (target - shown) * Math.min(1, dt * 6);
          }
          fill.style.transform = 'scaleX(' + shown.toFixed(4) + ')';
          pct.textContent = Math.round(shown * 100) + '%';
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
        window.__nav = {
          floor: function (p) { floor = Math.max(floor, p); },
          to: function (p, ms) { run = { from: shown, to: p, at: performance.now(), ms: Math.max(1, ms) }; },
          status: function (text) { status.textContent = text; },
          stopDrawing: function () {
            var w = boot.querySelector('.warp');
            if (w) w.style.display = 'none';
          }
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

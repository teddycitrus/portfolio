    <style>
      /*
       * The loader is the view from the observation deck in hyperspace, drawn
       * before any script runs. The window sits exactly where the 3D cockpit
       * puts it (the outline in src/scenes/ship/shape.ts, in screen space), so
       * when the scene takes over the two views line up and only the light
       * changes. Window corners in screen percent: x = 50 + 50 * nx, y = 50 - 50 * ny.
       */
      #boot {
        --hud: 191, 230, 255;
        --win: polygon(11% 10%, 89% 10%, 95% 18%, 95% 73%, 80% 85%, 20% 85%, 5% 73%, 5% 18%);
        --rim: polygon(10.2% 8.8%, 89.8% 8.8%, 96.1% 17.4%, 96.1% 73.6%, 80.6% 86.3%, 19.4% 86.3%, 3.9% 73.6%, 3.9% 17.4%);
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        color: rgb(var(--hud));
        font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: opacity 400ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      /* the deck: a dark bulkhead, the window frame, hyperspace through the glass */
      #boot .deck {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 90% 70% at 50% 0%, #1a2130 0%, #0c1018 60%, #07090e 100%);
        transition: opacity 450ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot .rim,
      #boot .win {
        position: absolute;
        inset: 0;
      }
      #boot .rim {
        clip-path: var(--rim);
        background: linear-gradient(180deg, #2c3646 0%, #1a212d 55%, #232c3a 100%);
      }
      #boot .win {
        clip-path: var(--win);
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #dfeaff 0%, #7d9ff0 6%, #3a5cb8 22%, #1d3170 48%, #0d1838 100%);
      }
      /*
       * Hyperspace: one field of streaks drawn once, in three copies zooming out
       * past the viewer a third of a cycle apart. Transform and opacity only, so
       * it runs on the compositor and never holds up the app loading under it.
       */
      #boot .win i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 110vmax;
        height: 110vmax;
        margin: -55vmax 0 0 -55vmax;
        background-size: 100% 100%;
        opacity: 0;
        will-change: transform, opacity;
        animation: boot-warp 1.6s linear infinite;
      }
      #boot .win i:nth-child(2) { animation-delay: -0.533s; --r: 40deg; }
      #boot .win i:nth-child(3) { animation-delay: -1.067s; --r: 80deg; }
      @keyframes boot-warp {
        0% { transform: scale(0.35) rotate(var(--r, 0deg)); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: scale(1.4) rotate(var(--r, 0deg)); opacity: 0; }
      }
      /* the scene is up and lines up underneath: the painted deck fades off it */
      #boot.boot-handoff .deck {
        opacity: 0;
      }
      #boot.boot-done {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .win i { animation: none; opacity: 0.8; transform: scale(0.9); }
        #boot .win i:nth-child(n + 2) { display: none; }
      }
    </style>
  </head>

    <div id="boot" role="status" aria-label="Loading">
      <div class="deck" aria-hidden="true">
        <div class="rim"></div>
        <div class="win"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      // The loader: hyperspace past the deck window. It runs before the app bundle; once the scene
      // is drawing under it, the app stops it through window.__nav.
      (function () {
        var boot = document.getElementById('boot');

        // draw the streak field once; CSS zooms the copies
        try {
          var N = 512;
          var cv = document.createElement('canvas');
          cv.width = cv.height = N;
          var g = cv.getContext('2d');
          var c = N / 2;
          g.lineCap = 'round';
          for (var i = 0; i < 220; i += 1) {
            var a = Math.random() * 6.2832;
            var r0 = c * (0.05 + Math.pow(Math.random(), 0.8) * 0.85);
            var len = c * (0.05 + 0.26 * (r0 / c));
            var k = 0.35 + 0.65 * (r0 / c);
            g.strokeStyle = 'rgba(235, 244, 255, ' + (0.9 * k).toFixed(3) + ')';
            g.lineWidth = 0.6 + 1.5 * k;
            g.beginPath();
            g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
            g.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len));
            g.stroke();
          }
          var url = 'url(' + cv.toDataURL('image/png') + ')';
          var layers = boot.querySelectorAll('.win i');
          for (var j = 0; j < layers.length; j += 1) layers[j].style.backgroundImage = url;
        } catch (e) {
          /* no canvas: the glow alone */
        }

        window.__nav = {
          stopDrawing: function () {
            var w = boot.querySelector('.deck');
            if (w) w.style.display = 'none';
          }
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse 60% 50% at 50% 45%, #0f1424 0%, #05070d 75%);
        color: #f1e6c8;
        transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-name {
        margin: 0;
        font-family: 'Archivo Variable', 'Arial Black', ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        font-stretch: 125%;
        font-size: clamp(18px, 4.4vw, 26px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f1e6c8;
        text-shadow: 0 2px 0 #10131c, 0 0 18px rgba(227, 178, 60, 0.25);
      }
      #boot svg {
        width: clamp(150px, 34vw, 190px);
        height: auto;
        overflow: visible;
      }
      #boot .bob {
        animation: boot-bob 1.4s ease-in-out infinite;
      }
      #boot .shadow {
        transform-origin: 100px 222px;
        animation: boot-shadow 1.4s ease-in-out infinite;
      }
      #boot .thumb {
        transform-origin: 130px 120px;
        animation: boot-thumb 1.4s ease-in-out infinite;
      }
      #boot .blink {
        transform-origin: 90px 72px;
        animation: boot-blink 3.2s infinite;
      }
      #boot .bar {
        display: flex;
        gap: 5px;
        padding: 5px;
        border: 2px solid #f1e6c8;
        border-radius: 4px;
      }
      #boot .bar i {
        width: 14px;
        height: 12px;
        border-radius: 1px;
        background: #e3b23c;
        opacity: 0.14;
        animation: boot-seg 1.8s steps(1) infinite;
      }
      #boot .bar i:nth-child(2) { animation-delay: 0.15s; }
      #boot .bar i:nth-child(3) { animation-delay: 0.3s; }
      #boot .bar i:nth-child(4) { animation-delay: 0.45s; }
      #boot .bar i:nth-child(5) { animation-delay: 0.6s; }
      #boot .bar i:nth-child(6) { animation-delay: 0.75s; }
      #boot .bar i:nth-child(7) { animation-delay: 0.9s; }
      #boot .bar i:nth-child(8) { animation-delay: 1.05s; }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes boot-shadow {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        50% { transform: scaleX(0.82); opacity: 0.3; }
      }
      @keyframes boot-thumb {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-7deg); }
      }
      @keyframes boot-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes boot-seg {
        0% { opacity: 0.14; }
        8% { opacity: 1; }
        70% { opacity: 1; }
        85% { opacity: 0.14; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bob, #boot .shadow, #boot .thumb, #boot .blink { animation: none; }
        #boot .bar i { animation-duration: 3.6s; }
      }
    </style>

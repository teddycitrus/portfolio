<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <title>Lost in space · yo its john</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        color: #e9eef7;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(1px 1px at 12% 18%, #fff8, transparent),
          radial-gradient(1px 1px at 72% 12%, #fff6, transparent),
          radial-gradient(1.5px 1.5px at 38% 64%, #fff7, transparent),
          radial-gradient(1px 1px at 86% 58%, #fff5, transparent),
          radial-gradient(1px 1px at 22% 82%, #fff6, transparent),
          radial-gradient(1.5px 1.5px at 62% 86%, #fff5, transparent),
          radial-gradient(1px 1px at 92% 30%, #fff7, transparent),
          radial-gradient(ellipse 60% 50% at 50% 45%, #0f1424 0%, #05070d 75%);
      }
      main {
        padding: 24px;
        text-align: center;
      }
      .code {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.3em;
        color: #a9dcff;
        text-shadow: 0 0 10px rgba(110, 200, 255, 0.5);
      }
      h1 {
        margin: 14px 0 28px;
        font-size: clamp(28px, 6vw, 44px);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        background: #e9eef7;
        color: #05070d;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: transform 150ms ease-out, background-color 150ms ease-out;
      }
      a:hover {
        background: #ffffff;
      }
      a:active {
        transform: scale(0.97);
      }
      a:focus-visible {
        outline: 2px solid #a9dcff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Nothing out here</h1>
      <a href="/">Back to the ship</a>
    </main>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#12203a"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <g transform="rotate(-18 32 32)">
    <!-- the far side of the orbit, behind the letters -->
    <path d="M5 32A27 8.5 0 0 1 59 32" fill="none" stroke="#7cc0ff" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>
  <!-- JM -->
